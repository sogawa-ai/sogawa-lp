<script>
  const params = new URLSearchParams(location.search);
  let lang = params.get('lang') === 'en' ? 'en' : 'ja';
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-ja]').forEach(el => {
      el.innerHTML = el.dataset[lang];
    });
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
    document.querySelectorAll('a[data-langlink]').forEach(a => {
      const base = a.dataset.langlink;
      a.href = lang === 'en' ? base + (base.includes('?') ? '&' : '?') + 'lang=en' : base;
    });
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.l; applyLang(); }));
  applyLang();
</script>
